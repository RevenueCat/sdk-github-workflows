name: Accept external PR
description: >-
  Handles an `@rcgitbot accept external` comment on a fork PR from a user with write access:
  creates `external/<author>/<pr number>` from the default branch, retargets the PR to it,
  squash-merges it at the commit a maintainer approved, and replies with a pre-filled link to open
  the internal PR. Called by the accept-external-pr reusable workflow on `issue_comment`.

runs:
  using: composite
  steps:
    - name: Accept external PR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT: ${{ github.event.comment.body }}
        LOGIN: ${{ github.event.comment.user.login }}
        PR_NUMBER: ${{ github.event.issue.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: exec bash "$GITHUB_ACTION_PATH/accept-external-pr.sh"
